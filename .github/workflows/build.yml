name: Build APK

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing key
        run: |
          if [ -f signing/debug.keystore.b64 ]; then
            mkdir -p ~/.android
            base64 -d signing/debug.keystore.b64 > ~/.android/debug.keystore
          fi

      - name: Build the APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --no-daemon -PversionCodeOverride=${{ github.run_number }} 2>&1 | tee build.log

      - name: Error summary
        if: failure()
        run: |
          {
            echo '## Build failed. Copy everything in the box below and paste it to your AI.'
            echo '```'
            grep -E "^e: |error:|What went wrong|Execution failed|FAILED|Could not |Unresolved" -A3 build.log | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the APK
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk screen-grab.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest screen-grab.apk \
            --target "${{ github.sha }}" \
            --title "Latest build (#${{ github.run_number }})" \
            --notes "Tap screen-grab.apk below to download it, then open it to install."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
